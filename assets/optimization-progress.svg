<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Mimi matched real-speech optimization comparison</title>
<desc id="desc">AutoKernel-style progress and latency plots for fast-kernel and Fast-Mimi on the same five-second LibriSpeech input, checkpoint, GPU, and eight codebooks.</desc>
<rect width="1440" height="900" fill="#ffffff"/>
<style>
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
  .axis{font-size:13px;fill:#536178}.small{font-size:12px;fill:#536178}.value{font-size:14px;font-weight:760}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;fill:#536178}
</style>
<text x="720" y="44" text-anchor="middle" font-size="30" font-weight="760">Mimi Optimization · Matched Real Speech</text>
<text x="720" y="77" text-anchor="middle" font-size="16" fill="#536178">same 5 s LibriSpeech crop · 8 codebooks · 15.508 → 5.675 ms · 2.733× vs Transformers baseline</text>

<rect x="104" y="124" width="1256" height="390" fill="none" stroke="#c9d2df" stroke-width="1.2"/>
<rect x="104" y="124" width="314" height="390" fill="#eef4ff"/>
<rect x="418" y="124" width="314" height="390" fill="#eaf8f4"/>
<rect x="732" y="124" width="628" height="390" fill="#eaf8fb"/>
<text x="261" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#5c7cfa">REFERENCE</text>
<text x="575" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#17a879">FAST-KERNEL</text>
<text x="1046" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#168e9e">FAST-MIMI</text>

<line x1="104" y1="476" x2="1360" y2="476" stroke="#d9e0ea"/>
<text class="axis" x="90" y="481" text-anchor="end">1.0×</text>
<line x1="104" y1="377" x2="1360" y2="377" stroke="#d9e0ea"/>
<text class="axis" x="90" y="382" text-anchor="end">1.5×</text>
<line x1="104" y1="278" x2="1360" y2="278" stroke="#d9e0ea"/>
<text class="axis" x="90" y="283" text-anchor="end">2.0×</text>
<line x1="104" y1="179" x2="1360" y2="179" stroke="#d9e0ea"/>
<text class="axis" x="90" y="184" text-anchor="end">2.5×</text>
<line x1="104" y1="476" x2="1360" y2="476" stroke="#5c7cfa" stroke-width="2.2" stroke-dasharray="8 6"/>

<path d="M 261 476 H 575 V 376.4 H 889 V 367.2 H 1203 V 132.9" fill="none" stroke="#17a879" stroke-width="4" stroke-linejoin="round" opacity="0.78"/>
<circle cx="261" cy="476" r="8" fill="#5c7cfa" stroke="#172033" stroke-width="1"/>
<circle cx="575" cy="376.4" r="8" fill="#17a879" stroke="#172033" stroke-width="1"/>
<circle cx="889" cy="367.2" r="8" fill="#168e9e" stroke="#172033" stroke-width="1"/>
<circle cx="1203" cy="132.9" r="8" fill="#168e9e" stroke="#172033" stroke-width="1"/>

<text class="value" x="273" y="457" fill="#5c7cfa">1.000×</text>
<text class="small" x="273" y="474">15.508 ms</text>
<text class="value" x="587" y="357" fill="#17a879">1.503×</text>
<text class="small" x="587" y="374">10.320 ms</text>
<text class="value" x="901" y="348" fill="#168e9e">1.549×</text>
<text class="small" x="901" y="365">10.010 ms</text>
<text class="value" x="1191" y="167" text-anchor="end" fill="#168e9e">2.733×</text>
<text class="small" x="1191" y="184" text-anchor="end">5.675 ms</text>

<text x="261" y="540" text-anchor="middle" font-size="13">Transformers reference</text>
<text x="575" y="540" text-anchor="middle" font-size="13">fast-kernel native</text>
<text x="889" y="540" text-anchor="middle" font-size="13">Fast-Mimi functional FP32</text>
<text x="1203" y="540" text-anchor="middle" font-size="13">Fast-Mimi guarded SM120</text>
<text x="28" y="319" text-anchor="middle" transform="rotate(-90 28 319)" font-size="15" font-weight="650">Speedup vs Transformers baseline (×)</text>

<g transform="translate(118,425)">
  <rect width="430" height="72" rx="4" fill="#ffffff" fill-opacity="0.94" stroke="#c9d2df"/>
  <text class="mono" x="11" y="19">LibriSpeech 1272-128104-0004 · SHA 07244790…c5404</text>
  <text class="mono" x="11" y="38">crop 10.48–15.48 s · 120,000 FP32 PCM · 24 kHz mono</text>
  <text class="mono" x="11" y="57">8 codebooks · RTX 5070 Ti · output hashes byte-identical</text>
</g>

<line x1="80" y1="578" x2="1360" y2="578" stroke="#d9e0ea"/>
<text x="80" y="620" font-size="23" font-weight="750">Matched end-to-end latency</text>
<text x="1360" y="620" text-anchor="end" class="small">Same real PCM tensor, checkpoint, software, GPU, duration, and codebook count.</text>

<line x1="405" y1="650" x2="405" y2="840" stroke="#e4e9f0"/>
<text class="axis" x="405" y="864" text-anchor="middle">0 ms</text>
<line x1="690" y1="650" x2="690" y2="840" stroke="#e4e9f0"/>
<text class="axis" x="690" y="864" text-anchor="middle">5 ms</text>
<line x1="975" y1="650" x2="975" y2="840" stroke="#e4e9f0"/>
<text class="axis" x="975" y="864" text-anchor="middle">10 ms</text>
<line x1="1260" y1="650" x2="1260" y2="840" stroke="#e4e9f0"/>
<text class="axis" x="1260" y="864" text-anchor="middle">15 ms</text>

<text x="385" y="680" text-anchor="end" font-size="13">Transformers reference</text>
<rect x="405" y="661" width="884.0" height="28" fill="#5c7cfa" opacity="0.72"/>
<text class="value" x="1300" y="681" fill="#5c7cfa">15.508 ms</text>
<text x="385" y="726" text-anchor="end" font-size="13">fast-kernel native</text>
<rect x="405" y="707" width="588.2" height="28" fill="#17a879" opacity="0.72"/>
<text class="value" x="1004" y="727" fill="#17a879">10.320 ms</text>
<text x="385" y="772" text-anchor="end" font-size="13">Fast-Mimi functional FP32</text>
<rect x="405" y="753" width="570.6" height="28" fill="#168e9e" opacity="0.72"/>
<text class="value" x="987" y="773" fill="#168e9e">10.010 ms</text>
<text x="385" y="818" text-anchor="end" font-size="13">Fast-Mimi guarded SM120</text>
<rect x="405" y="799" width="323.5" height="28" fill="#168e9e" opacity="0.88"/>
<text class="value" x="740" y="819" fill="#168e9e">5.675 ms</text>

<text class="small" x="720" y="891" text-anchor="middle">Click the chart in README for interactive details and the technique-level comparison.</text>
</svg>
